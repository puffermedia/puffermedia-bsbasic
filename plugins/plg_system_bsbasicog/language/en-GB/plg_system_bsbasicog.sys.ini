PLG_SYSTEM_BSBASICOG="System - BS Basic Open Graph"
PLG_SYSTEM_BSBASICOG_XML_DESCRIPTION="Adds an Open Graph tab to the article edit form (title, description, image) and outputs those values as Open Graph tags on the article page. On article pages it also sets og:type to article, adds article:published_time and article:modified_time, and adds datePublished and dateModified to the article's schema.org data (when System - Schema.org is enabled). It also adds a Bootstrap tab to site menu items, for loading Bootstrap JS components on that menu item's pages only. Companion to the puffermedia-bsbasic template; leave a field empty to keep the template's default."
