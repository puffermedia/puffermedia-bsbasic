PLG_SYSTEM_BSBASICOG="System - BS Basic Open Graph"
PLG_SYSTEM_BSBASICOG_XML_DESCRIPTION="Adds an Open Graph tab to the article edit form (title, description, image) and outputs those values as Open Graph tags on the article page. On article pages it also sets og:type to article, adds article:published_time and article:modified_time, and adds datePublished and dateModified to the article's schema.org data (when System - Schema.org is enabled). It also adds a Bootstrap tab to site menu items, for loading Bootstrap JS components on that menu item's pages only. Companion to the puffermedia-bsbasic template; leave a field empty to keep the template's default."
PLG_SYSTEM_BSBASICOG_TAB="Open Graph"
PLG_SYSTEM_BSBASICOG_FIELD_TITLE_LABEL="Open Graph Title"
PLG_SYSTEM_BSBASICOG_FIELD_TITLE_DESC="Title shown when this article is shared (og:title). Leave empty to use the page title. About 60 to 95 characters at most."
PLG_SYSTEM_BSBASICOG_FIELD_DESCRIPTION_LABEL="Open Graph Description"
PLG_SYSTEM_BSBASICOG_FIELD_DESCRIPTION_DESC="Short text shown when this article is shared (og:description). Leave empty to use the article's Meta Description. About 150 to 200 characters at most."
PLG_SYSTEM_BSBASICOG_FIELD_IMAGE_LABEL="Open Graph Image"
PLG_SYSTEM_BSBASICOG_FIELD_IMAGE_DESC="Image shown when this article is shared (og:image), about 1200 x 630px. Leave empty to use the template's Default Share Image."
PLG_SYSTEM_BSBASICOG_BS_TAB="Bootstrap"
PLG_SYSTEM_BSBASICOG_BS_COMPONENTS_LABEL="Bootstrap JS Components"
PLG_SYSTEM_BSBASICOG_BS_COMPONENTS_DESC="Load these Bootstrap scripts on this menu item's pages only, on top of any the template style loads on every page. Also applies to pages opened from this menu item, such as articles in a blog. Tooltips (<code>data-bs-toggle=&quot;tooltip&quot;</code>), popovers (<code>data-bs-toggle=&quot;popover&quot;</code>) and toasts (<code>.toast</code>) are also initialized. Needs the puffermedia-bsbasic template."
PLG_SYSTEM_BSBASICOG_BS_ALERT="Alert (dismissible)"
PLG_SYSTEM_BSBASICOG_BS_CAROUSEL="Carousel"
PLG_SYSTEM_BSBASICOG_BS_DROPDOWN="Dropdown"
PLG_SYSTEM_BSBASICOG_BS_MODAL="Modal"
