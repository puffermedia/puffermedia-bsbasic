TPL_BSBASIC_FIELD_FONTAWESOME_DESC="Load the Font Awesome icon font that ships with Joomla, e.g. <code>&lt;span class=&quot;fa-solid fa-star&quot;&gt;&lt;/span&gt;</code>. No external request."
TPL_BSBASIC_FIELDSET_BS_DEV_LABEL="Developer"
TPL_BSBASIC_FIELD_BPINDICATOR_LABEL="Breakpoint Indicator"
TPL_BSBASIC_FIELD_BPINDICATOR_DESC="Show a small badge with the current Bootstrap breakpoint (xs, sm, md, lg, xl, xxl) in the bottom corner. Only shown while System Debug is on in Global Configuration, so it never appears on a live site."
TPL_BSBASIC_FIELDSET_BS_VARIANTS_LABEL="Tables &amp; List Groups"
TPL_BSBASIC_FIELD_TABLEVARIANTS_LABEL="Tables follow Theme Colors"
TPL_BSBASIC_FIELD_TABLEVARIANTS_DESC="Recolor Bootstrap's contextual table classes (<code>.table-primary</code>, <code>.table-success</code> …) from the Primary Color and the Bootstrap Theme Colors, including the striped, hover, active and border shades. Bootstrap hard-codes these, so No keeps its stock colors."
TPL_BSBASIC_FIELD_LISTGROUPVARIANTS_LABEL="List Groups follow Theme Colors"
TPL_BSBASIC_FIELD_LISTGROUPVARIANTS_DESC="<code>.list-group-item-primary</code>, <code>-success</code> … read the <code>--bs-{color}-bg-subtle</code> variables the theme colors set, so they follow the palette; Yes also recolors <code>-light</code> and <code>-dark</code> when those colors are set. No restores Bootstrap's own list-group colors."
