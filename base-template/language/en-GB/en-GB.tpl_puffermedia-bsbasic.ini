TPL_BSBASIC_FIELD_BSCOMPONENTS_LABEL="Bootstrap JS Components"
TPL_BSBASIC_FIELD_BSCOMPONENTS_DESC="Load Joomla's bundled Bootstrap scripts on every page so their markup works in articles and Custom modules. Tooltips (<code>data-bs-toggle=&quot;tooltip&quot;</code>), popovers (<code>data-bs-toggle=&quot;popover&quot;</code>) and toasts (<code>.toast</code>) are also initialized. The header menu loads its own Collapse or Offcanvas script whatever is ticked here."
